<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Parking Bays road marking"><title>RM6 — Parking Bays</title><desc>Drawn to specification, not traced. Source: SARTSM Vol 1 §7.2.10; NRTR 2000 reg 305. White lines minimum 100 mm wide defining the limits of each bay. Driver must park wholly within them.</desc><rect width="240" height="240" fill="#93938E"/><line x1="96" y1="0" x2="96" y2="240" stroke="#F7F7F6" stroke-width="6"/><line x1="8" y1="40" x2="96" y2="40" stroke="#F7F7F6" stroke-width="6"/><line x1="8" y1="112" x2="96" y2="112" stroke="#F7F7F6" stroke-width="6"/><line x1="8" y1="184" x2="96" y2="184" stroke="#F7F7F6" stroke-width="6"/><rect x="196" y="200" width="34" height="34" rx="7" fill="#93938E"/><path d="M213 206 L204 228 L222 228 Z" fill="#1F1F1F"/></svg>
