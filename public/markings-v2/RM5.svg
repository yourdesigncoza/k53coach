<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Painted Island road marking"><title>RM5 — Painted Island</title><desc>Drawn to specification, not traced. Source: SARTSM Vol 1 §7.2.9. White boundary lines minimum 100 mm wide enclosing yellow sloping bars, minimum 150 mm wide, bar-to-space ratio 1:2.</desc><defs><pattern id="rm5" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="24" fill="#EECA1A"/></pattern><clipPath id="rm5c"><path d="M120 26 L152 74 V166 L120 214 L88 166 V74 Z"/></clipPath></defs><rect width="240" height="240" fill="#93938E"/><g clip-path="url(#rm5c)"><rect width="240" height="240" fill="url(#rm5)"/></g><path d="M120 26 L152 74 V166 L120 214 L88 166 V74 Z" fill="none" stroke="#F7F7F6" stroke-width="6"/><rect x="196" y="200" width="34" height="34" rx="7" fill="#93938E"/><path d="M213 206 L204 228 L222 228 Z" fill="#1F1F1F"/></svg>
