  <ns0:title id="title">RM8 Mandatory Direction Arrows – Uniform Thickness</ns0:title>
  <ns0:desc id="desc">Six yellow mandatory direction arrows with consistent shaft thickness. RM8.6 has a smooth split with arrowheads only at the left and right ends.</ns0:desc>

