<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="45.88 50.88 668.24 838.24">
  <defs>
    <linearGradient id="roadGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66686a"/>
      <stop offset="1" stop-color="#4e5052"/>
    </linearGradient>

    <linearGradient id="grassGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6b21"/>
      <stop offset="1" stop-color="#78973b"/>
    </linearGradient>

    <pattern id="roadTexture" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="url(#roadGradient)"/>
      <path d="M2 5l5 2m6-3l4 2M3 15l6-2m4 5l5-3" stroke="#77797b" stroke-width="1" opacity=".3"/>
    </pattern>

    <pattern id="pavingPattern" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#b8aa91"/>
      <path d="M0 0H26V26H0ZM13 0V26M0 13H26" fill="none" stroke="#8b7d69" stroke-width="1"/>
    </pattern>

    <clipPath id="ovalClip">
      <ellipse cx="380" cy="470" rx="310" ry="395"/>
    </clipPath>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>

  <g id="RTM4-master" filter="url(#softShadow)">
    <ellipse cx="380" cy="470" rx="318" ry="403" fill="#2b2b2b"/>

    <g clip-path="url(#ovalClip)">
      <!-- Grass -->
      <rect x="70" y="75" width="115" height="790" fill="url(#grassGradient)"/>
      <rect x="575" y="75" width="115" height="790" fill="url(#grassGradient)"/>

      <!-- Paved sidewalks -->
      <rect x="170" y="75" width="52" height="790" fill="url(#pavingPattern)"/>
      <rect x="538" y="75" width="52" height="790" fill="url(#pavingPattern)"/>

      <!-- Road -->
      <rect x="222" y="75" width="316" height="790" fill="url(#roadTexture)"/>

      <!-- Kerb lines -->
      <rect x="217" y="75" width="5" height="790" fill="#7f7f7f"/>
      <rect x="538" y="75" width="5" height="790" fill="#7f7f7f"/>

      <!-- Yellow road-edge lines -->
      <rect x="230" y="75" width="8" height="790" fill="#efab00"/>
      <rect x="522" y="75" width="8" height="790" fill="#efab00"/>

      <!-- Centre broken lane line -->
      <g id="centre-broken-line" fill="#ffffff">
        <rect x="375" y="105" width="10" height="50"/>
        <rect x="375" y="195" width="10" height="50"/>
        <rect x="375" y="285" width="10" height="50"/>
        <rect x="375" y="630" width="10" height="50"/>
        <rect x="375" y="720" width="10" height="50"/>
        <rect x="375" y="810" width="10" height="50"/>
      </g>




      <!-- Correct yield markings -->
      <g id="yield-lines" fill="#ffffff">
        <!-- TOP approach: on the right-hand lane only -->
        <rect x="410" y="405" width="26" height="15"/>
        <rect x="445" y="405" width="26" height="15"/>
        <rect x="480" y="405" width="26" height="15"/>

        <!-- BOTTOM approach: on the left-hand lane only -->
        <rect x="250" y="620" width="26" height="15"/>
        <rect x="285" y="620" width="26" height="15"/>
        <rect x="320" y="620" width="26" height="15"/>
      </g>

      <!-- RTM4 block pedestrian crossing -->
      <g id="block-crossing" fill="#ffffff">
        <rect x="250" y="445" width="30" height="145"/>
        <rect x="296" y="445" width="30" height="145"/>
        <rect x="342" y="445" width="30" height="145"/>
        <rect x="388" y="445" width="30" height="145"/>
        <rect x="434" y="445" width="30" height="145"/>
        <rect x="480" y="445" width="30" height="145"/>
      </g>

      <!-- Stylised trees -->
      <g id="trees">
        <g transform="translate(125 180)">
          <rect x="-7" y="34" width="14" height="42" rx="3" fill="#66503a"/>
          <circle cx="-18" cy="5" r="35" fill="#315315"/>
          <circle cx="18" cy="0" r="38" fill="#3d6518"/>
          <circle cx="0" cy="-26" r="34" fill="#527720"/>
        </g>
        <g transform="translate(635 180)">
          <rect x="-7" y="34" width="14" height="42" rx="3" fill="#66503a"/>
          <circle cx="-18" cy="5" r="35" fill="#315315"/>
          <circle cx="18" cy="0" r="38" fill="#3d6518"/>
          <circle cx="0" cy="-26" r="34" fill="#527720"/>
        </g>
        <g transform="translate(125 700)">
          <rect x="-7" y="34" width="14" height="42" rx="3" fill="#66503a"/>
          <circle cx="-18" cy="5" r="35" fill="#315315"/>
          <circle cx="18" cy="0" r="38" fill="#3d6518"/>
          <circle cx="0" cy="-26" r="34" fill="#527720"/>
        </g>
        <g transform="translate(635 700)">
          <rect x="-7" y="34" width="14" height="42" rx="3" fill="#66503a"/>
          <circle cx="-18" cy="5" r="35" fill="#315315"/>
          <circle cx="18" cy="0" r="38" fill="#3d6518"/>
          <circle cx="0" cy="-26" r="34" fill="#527720"/>
        </g>
      </g>
    </g>

    <ellipse cx="380" cy="470" rx="310" ry="395" fill="none" stroke="#202020" stroke-width="9"/>
  </g>

  <g id="labels" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    </g>
</svg>