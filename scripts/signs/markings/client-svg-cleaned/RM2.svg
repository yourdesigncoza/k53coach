<svg xmlns="http://www.w3.org/2000/svg" viewBox="69.6 89.6 1060.8 520.8" role="img" aria-labelledby="title desc">
  <title id="title">RM2 No Crossing Lines</title>
  <desc id="desc">A two-way road with two continuous parallel solid white centre lines separating opposing traffic.</desc>


  <rect id="road" x="90" y="110" width="1020" height="480" rx="10" fill="#5A5D60" />


  <line x1="90" y1="110" x2="1110" y2="110" stroke="#303234" stroke-width="6" />
  <line x1="90" y1="590" x2="1110" y2="590" stroke="#303234" stroke-width="6" />


  <g id="rm2-lines" fill="#FFFFFF">
    <rect x="155" y="329" width="890" height="14" rx="2" />
    <rect x="155" y="357" width="890" height="14" rx="2" />
  </g>


  <g id="direction-arrows" fill="#FFFFFF">

    <path d="M330 237 H470 V205 L535 250 L470 295 V263 H330 Z" />

    <path d="M870 463 H730 V495 L665 450 L730 405 V437 H870 Z" />
  </g>


  </svg>