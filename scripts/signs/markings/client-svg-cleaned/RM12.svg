<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="51.76 126.76 948.48 556.48" role="img" aria-labelledby="title desc">

  <title id="title">RM12 No Stopping Line</title>
  <desc id="desc">Editable vector illustration showing the continuous red RM12 no-stopping line for 24-hour restriction and the broken red RM12 line for selective periods.</desc>

  <g id="rm12-solid-panel">
    <rect x="70" y="145" width="500" height="520" rx="10" fill="#FFFFFF" stroke="#D7D7D2" stroke-width="3" />

    <rect x="105" y="215" width="430" height="400" fill="#575A5D" />
    <rect x="105" y="215" width="105" height="400" fill="#D6D1C8" />
    <rect x="198" y="215" width="16" height="400" fill="#AAA59D" />


    <rect id="rm12-solid-red-line" x="230" y="235" width="18" height="360" fill="#D82424" />


    <g fill="#FFFFFF">
      <rect x="410" y="235" width="12" height="65" />
      <rect x="410" y="350" width="12" height="65" />
      <rect x="410" y="465" width="12" height="65" />
      <rect x="410" y="580" width="12" height="15" />
    </g>


    <path d="M325 555 V440 H310 L335 400 L360 440 H345 V555 Z" fill="#FFFFFF" />

    </g>


  <g fill="#FFFFFF">
      <rect x="970" y="235" width="12" height="65" />
      <rect x="970" y="350" width="12" height="65" />
      <rect x="970" y="465" width="12" height="65" />
      <rect x="970" y="580" width="12" height="15" />
    </g>


    <path d="M885 555 V440 H870 L895 400 L920 440 H905 V555 Z" fill="#FFFFFF" />

    </g>


  </svg>