<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"

     viewBox="69.6 89.6 1060.8 520.8"
     role="img"
     aria-labelledby="title desc">
  <title id="title">RM1 No Overtaking Line</title>
  <desc id="desc">A two-way road with a single continuous solid white centre line and directional arrows.</desc>

  <!-- Background -->
  <!-- Road -->
  <rect id="road" x="90" y="110" width="1020" height="480" rx="10" fill="#5A5D60"/>

  <!-- Road edge outlines -->
  <line x1="90" y1="110" x2="1110" y2="110" stroke="#303234" stroke-width="6"/>
  <line x1="90" y1="590" x2="1110" y2="590" stroke="#303234" stroke-width="6"/>

  <!-- RM1: single continuous solid white no-overtaking line -->
  <rect id="rm1-line" x="155" y="341" width="890" height="18" rx="3" fill="#FFFFFF"/>

  <!-- Direction arrows -->
  <g id="direction-arrows" fill="#FFFFFF">
    <!-- Upper lane: left to right -->
    <path d="M330 237 H470 V205 L535 250 L470 295 V263 H330 Z"/>
    <!-- Lower lane: right to left -->
    <path d="M870 463 H730 V495 L665 450 L730 405 V437 H870 Z"/>
  </g>

  <!-- Labels -->



</svg>
