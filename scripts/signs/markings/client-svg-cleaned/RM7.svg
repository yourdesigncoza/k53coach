    <ellipse cx="600" cy="345" rx="82" ry="55" stroke-width="16"/>
    <ellipse cx="600" cy="345" rx="65" ry="40" stroke-width="6"/>
  </g>


  <text id="rm7-designator-letter" x="600" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#F5C400">B</text><path d="M240 515 H435 V480 L515 550 L435 620 V585 H240 Z" fill="#FFFFFF"/>


