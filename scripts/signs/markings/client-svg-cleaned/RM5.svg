<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="69.6 99.6 1060.8 540.8" role="img" aria-labelledby="title desc">
  <title id="title">RM5 Painted Island</title>
  <desc id="desc">A two-way road with a central painted island bounded by continuous white lines and filled with yellow diagonal bars.</desc>


  <rect id="road" x="90" y="120" width="1020" height="500" rx="10" fill="#5A5D60" />


  <line x1="90" y1="120" x2="1110" y2="120" stroke="#303234" stroke-width="6" />
  <line x1="90" y1="620" x2="1110" y2="620" stroke="#303234" stroke-width="6" />


  <g id="rm5-boundary" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round">
    <path d="M220 330 L980 330" />
    <path d="M220 430 L980 430" />
  </g>


  <g id="rm5-bars" stroke="#F5C400" stroke-width="30" stroke-linecap="butt">
    <line x1="250" y1="420" x2="340" y2="340" />
    <line x1="350" y1="420" x2="440" y2="340" />
    <line x1="450" y1="420" x2="540" y2="340" />
    <line x1="550" y1="420" x2="640" y2="340" />
    <line x1="650" y1="420" x2="740" y2="340" />
    <line x1="750" y1="420" x2="840" y2="340" />
    <line x1="850" y1="420" x2="940" y2="340" />
  </g>


  <g id="direction-arrows" fill="#FFFFFF">

    <path d="M300 220 H470 V185 L545 250 L470 315 V280 H300 Z" />

    <path d="M900 520 H730 V555 L655 490 L730 425 V460 H900 Z" />
  </g>


  </svg>